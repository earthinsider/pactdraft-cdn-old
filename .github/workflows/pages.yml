name: Deploy CDN
on:
  push:
    branches: [main]
    paths: ['image/**', 'index.html', 'robots.txt']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files and size
        run: |
          mkdir -p image
          for f in image/*; do
            [ -e "$f" ] || continue
            n=$(basename "$f")
            if ! echo "$n" | grep -Eq '^[a-z0-9][a-z0-9-]*\.webp$'; then echo "::warning::unexpected file name $n (use <article-slug>.webp)"; fi
            s=$(stat -c %s "$f")
            if [ "$s" -gt 153600 ]; then echo "::warning::$n is $((s / 1024)) KB (over 150 KB)"; fi
          done
          mb=$(du -sm image | cut -f1)
          echo "image/ = ${mb} MB (GitHub Pages limit is about 1000 MB)"
          if [ "$mb" -gt 900 ]; then echo "::error::over 900 MB: create pactdraft-cdn-2 now"; exit 1; fi
          if [ "$mb" -gt 700 ]; then echo "::warning::over 700 MB: prepare pactdraft-cdn-2"; fi
      - name: Prepare site folder
        run: |
          mkdir _site
          cp -r image index.html robots.txt _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
